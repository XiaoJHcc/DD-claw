<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DD-claw 控制面板</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
<aside class="sidenav">
<div class="side-logo"><span class="logo-paw" data-icon="paw"></span>
<div class="logo-txt"><b>DD-claw</b><small>直播监听台</small></div>
</div>
<nav class="side-nav">
<button class="nav-item active" data-action="nav-view" data-view="schedule"><i data-icon="calendar"></i><span>时间表</span></button>
<button class="nav-item" data-action="nav-view" data-view="streamers"><i data-icon="users"></i><span>主播列表</span></button>
<button class="nav-item" data-action="nav-view" data-view="settings"><i data-icon="gear"></i><span>设置</span></button>
<button class="nav-item" data-action="nav-view" data-view="x"><i data-icon="send"></i><span>X / 推特</span></button>
</nav>
<div class="side-foot">
<span class="live-count"><i class="pulse"></i>在播 <b id="side-live-count">0</b></span>
</div>
</aside>

<main class="view-host">
<div class="view" id="view-schedule">
<section class="card acc-blue" id="card-schedule">
<div class="card-head"><span class="card-ic" data-icon="calendar"></span><h2>时间表</h2>
<div class="card-head-end"><span class="sched-lg"><i class="lg-live"></i>在播</span><span class="sched-lg"><i class="lg-now"></i>现在</span></div></div>
<div id="schedule-axis" class="sched-axis"></div>
<div id="schedule-body" class="sched-body">加载中…</div>
</section>
</div>

<div class="view hidden" id="view-streamers">
<div class="st-grid" id="streamer-list">加载中…</div>
</div>

<div class="view hidden" id="view-settings">
<div class="set-grid" id="settings-grid">
<section class="card set-card acc-pink" id="card-listen">
<div class="card-head"><span class="card-ic" data-icon="headphone"></span><h2>监听</h2></div>
<div id="listen-rows">加载中…</div>
<div class="card-actions">
<button class="btn btn-line" data-action="open-fetch-settings"><span data-icon="sliders"></span>抓取设置</button>
</div>
</section>

<section class="card set-card acc-cyan" id="card-napcat">
<div class="card-head"><span class="card-ic" data-icon="bot"></span><h2>NapCat</h2>
<div class="card-head-end">
<span id="napcat-need-uin" class="row-sub" style="display:none">需要填写机器人QQ号</span>
<label class="switch"><input type="checkbox" id="napcat-enabled" data-change="toggle-napcat"><span class="knob"></span></label>
</div>
</div>
<div id="napcat-rows">加载中…</div>
<div class="card-actions" id="napcat-actions">
<button class="btn btn-ghost" data-action="napcat-launch"><span data-icon="bolt"></span>手动拉起</button>
</div>
</section>

<section class="card set-card acc-purple" id="card-llm">
<div class="card-head"><span class="card-ic" data-icon="sparkles"></span><h2>LLM 供应商</h2>
<div class="card-head-end">
<label class="switch"><input type="checkbox" id="llm-enabled" data-change="toggle-llm"><span class="knob"></span></label>
</div>
</div>
<div id="llm-list">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="add-llm"><span data-icon="plus"></span>新增供应商</button>
<button class="btn btn-line" data-action="open-llm-advanced"><span data-icon="sliders"></span>高级</button>
</div>
</section>

<section class="card set-card acc-blue" id="card-push">
<div class="card-head"><span class="card-ic" data-icon="bell"></span><h2>推送渠道</h2>
<div class="card-head-end">
<label class="switch"><input type="checkbox" id="push-enabled" data-change="toggle-push"><span class="knob"></span></label>
</div>
</div>
<div id="channel-list">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="add-channel"><span data-icon="plus"></span>新增渠道</button>
<button class="btn btn-line" data-action="open-push-settings"><span data-icon="sliders"></span>推送设置</button>
</div>
</section>

<section class="card set-card acc-amber" id="card-categories">
<div class="card-head"><span class="card-ic" data-icon="tag"></span><h2>分类规则</h2></div>
<div id="category-list">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="add-category"><span data-icon="plus"></span>新增分类</button>
</div>
</section>

<section class="card set-card acc-mint" id="card-rules">
<div class="card-head"><span class="card-ic" data-icon="list"></span><h2>推送规则</h2></div>
<div id="rule-list">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="add-push-rule"><span data-icon="plus"></span>添加规则</button>
</div>
</section>
</div>

<section class="card acc-blue" id="card-follows">
<div class="card-head"><span class="card-ic" data-icon="users"></span><h2>关注列表</h2>
<div class="card-head-end">
<div class="search-box"><i data-icon="search"></i><input class="inp" id="follow-search" data-input="follow-search" placeholder="搜索昵称 / UID"></div>
</div>
</div>
<div id="follow-list" class="follow-grid">加载中…</div>
</section>
</div>

<div class="view hidden" id="view-x">
<div class="set-grid">
<section class="card set-card acc-blue" id="card-x-conn">
<div class="card-head"><span class="card-ic" data-icon="send"></span><h2>连接</h2></div>
<div id="x-conn-rows">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="test-x-all"><span data-icon="bolt"></span>测试全部</button>
<button class="btn btn-line" data-action="open-x-settings"><span data-icon="sliders"></span>X 源设置</button>
</div>
</section>

<section class="card set-card acc-cyan" id="card-x-listen">
<div class="card-head"><span class="card-ic" data-icon="headphone"></span><h2>监听</h2></div>
<div id="x-listen-rows">加载中…</div>
<div class="card-actions">
<span class="row-sub">轮询与归档已接（P1）；图文帖推送规则在 P2</span>
</div>
</section>
<section class="card set-card acc-mint" id="card-x-accounts">
<div class="card-head"><span class="card-ic" data-icon="users"></span><h2>关注账号</h2></div>
<div id="x-account-rows">加载中…</div>
<div class="card-actions">
<button class="btn btn-ghost" data-action="add-x-account"><span data-icon="plus"></span>添加账号</button>
</div>
</section>
</div>
</div>
</main>
</div>

<div id="sheet-mask1" class="sheet-mask hidden"><div class="sheet"></div></div>
<div id="sheet-mask2" class="sheet-mask hidden"><div class="sheet"></div></div>
<div id="toasts" class="toasts"></div>

<script type="module" src="./js/boot.js"></script>
</body>
</html>
