<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD-claw 控制面板 · UI Demo v2</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
<aside class="sidenav">
  <div class="side-logo"><span class="logo-paw" data-icon="paw"></span>
    <div class="logo-txt"><b>DD-claw</b><small>直播监听台</small></div>
  </div>
  <nav class="side-nav">
    <button class="nav-item" data-action="nav-view" data-view="schedule"><i data-icon="calendar"></i><span>时间表</span><em class="nav-soon">待定</em></button>
    <button class="nav-item" data-action="nav-view" data-view="streamers"><i data-icon="users"></i><span>主播列表</span><em class="nav-soon">待定</em></button>
    <button class="nav-item active" data-action="nav-view" data-view="settings"><i data-icon="gear"></i><span>设置</span></button>
  </nav>
  <div class="side-foot">
    <span class="live-count"><i class="pulse"></i>在播 <b id="side-live-count">0</b></span>
    <span class="demo-badge">UI Demo v2</span>
  </div>
</aside>

<main class="view-host">
  <section class="view" id="view-schedule" hidden>
    <div class="wip-card"><span class="wip-ic" data-icon="calendar"></span><b>时间表</b>
      <p>布局与动画算法沿用线上版，视觉待设置页定调后按同一设计系统重做</p>
    </div>
  </section>

  <section class="view" id="view-streamers" hidden>
    <div class="wip-card"><span class="wip-ic" data-icon="users"></span><b>主播列表</b>
      <p>待设置页定调后按同一设计系统重做</p>
    </div>
  </section>

  <section class="view" id="view-settings">
    <div class="set-grid" id="settings-grid"></div>
    <section class="card acc-blue" id="card-follows">
      <div class="card-head">
        <span class="card-ic" data-icon="users"></span><h2>关注列表</h2>
        <div class="card-head-end">
          <div class="search-box"><i data-icon="search"></i><input class="inp" id="follow-q" data-input="follow-q" placeholder="搜索昵称 / UID"></div>
        </div>
      </div>
      <div class="follow-grid" id="follow-grid"></div>
    </section>
  </section>
</main>
</div>

<div class="sheet-mask" id="sheet-mask1" hidden><div class="sheet" id="sheet1"></div></div>
<div class="sheet-mask" id="sheet-mask2" hidden><div class="sheet" id="sheet2"></div></div>
<div class="toasts" id="toasts"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
